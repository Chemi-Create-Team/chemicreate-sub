allprojects {
    afterEvaluate {
        extensions.getByName('neoForge').runs.named('gameTestServer') {
            gameDirectory.set(new File('/tmp/create-refinery-electric-utilities'))
            systemProperty 'createplant.gameTestClasses', System.getProperty('testClasses', 'ElectricUtilityGameTests')
            systemProperty 'createplant.electricUtilityReport', new File(project.projectDir, 'build/electric-utilities.json').absolutePath
        }
    }
}
