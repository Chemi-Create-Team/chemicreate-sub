allprojects {
    afterEvaluate {
        extensions.getByName('neoForge').runs.named('gameTestServer') {
            gameDirectory.set(new File(System.getProperty('testDir', '/tmp/createplant-circular-tests')))
            systemProperty 'createplant.gameTestClasses', System.getProperty('testClasses', 'WetProcessingGameTests,OreLeachingGameTests,ReactorGameTests,AssemblyGameTests,SurvivalReachabilityGameTests')
        }
    }
}
