        extensions.getByName('neoForge').runs.named('gameTestServer') {
            systemProperty 'createplant.gameTestClasses', 'MaterialPumpGameTests,GasPipeGameTests,WorldLiquidTransferGameTests,BuildingMaterialsGameTests,NitricPlantIntegrationGameTests,SurvivalReachabilityGameTests'
        }
    }
}
