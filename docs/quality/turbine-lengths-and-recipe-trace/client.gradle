allprojects {
    afterEvaluate {
        tasks.named('runClient').configure {
            doFirst {
                def options = new File(project.projectDir, 'run/options.txt')
                def lines = options.exists() ? options.readLines('UTF-8') : []
                lines.removeAll { it.startsWith('lang:') || it.startsWith('guiScale:') }
                lines.add('lang:ja_jp'); lines.add('guiScale:2')
                options.setText(lines.join('\n') + '\n', 'UTF-8')
            }
        }
        extensions.getByName('neoForge').runs.named('client') {
            programArgument '--width'; programArgument '1280'
            programArgument '--height'; programArgument '800'
            systemProperty 'createplant.clientQualityCheck', 'true'
            systemProperty 'createplant.clientQualityLanguage', 'ja_jp'
            systemProperty 'createplant.clientQualityScenes', 'turbine_multiblock,plant_manufacturing_mining_explosives'
            systemProperty 'createplant.clientQualityTargets', 'high_pressure_turbine_unit@turbine_multiblock,low_pressure_turbine_unit@turbine_multiblock,minecraft:gunpowder@plant_manufacturing_mining_explosives,minecraft:gunpowder@plant_manufacturing_mining_explosives,synthesis_gas_bucket@jei_stirred_reactor,synthesis_gas_bucket@jei_haber_bosch'
            systemProperty 'createplant.clientQualitySeekFromEnd', '1'
            systemProperty 'createplant.clientQualityRotation.0', '35'
            systemProperty 'createplant.clientQualityRotation.1', '215'
            systemProperty 'createplant.clientQualityRotation.2', '35'
            systemProperty 'createplant.clientQualityCaptureDelay', '240'
            systemProperty 'createplant.clientQualitySkipScreenshots', 'true'
            systemProperty 'createplant.recipeTraceCheck', 'true'
            systemProperty 'createplant.clientQualitySeek.2', '100'
            systemProperty 'createplant.clientQualitySeek.3', '1050'
        }
    }
}
