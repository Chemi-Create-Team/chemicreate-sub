allprojects {
    afterEvaluate {
        extensions.getByName('neoForge').runs.named('gameTestServer') {
            gameDirectory.set(new File(System.getProperty('testDir', '/tmp/createplant-material-ponder-tests')))
            systemProperty 'createplant.gameTestClasses', System.getProperty('testClasses', 'ManufacturingPonderGameTests')
        }
    }
}
